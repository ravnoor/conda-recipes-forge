context:
  name: dcm2niix
  version: "1.0.20260416"  # Use latest version

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/rordenlab/dcm2niix.git
  tag: v${{ version }}

build:
  number: 0
  script: |
    #!/usr/bin/env bash

    set -e

    mkdir -p build && cd build
    export CFLAGS="$CFLAGS -D_GNU_SOURCE"
    export CXXFLAGS="$CXXFLAGS -D_GNU_SOURCE"
    cmake \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_C_FLAGS="$CFLAGS" \
      -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
      -DCMAKE_INSTALL_PREFIX=$PREFIX \
      -DUSE_STATIC_RUNTIME:BOOL=OFF \
      -DBATCH_VERSION=ON \
      -DUSE_JPEGLS=ON \
      -DUSE_OPENJPEG=ON \
      -DUSE_JASPER=OFF \
      -DUSE_TURBOJPEG=OFF \
      -DUSE_ZSTD=OFF \
      -DZLIB_IMPLEMENTATION=Cloudflare \
      ..
    make -j${CPU_COUNT}
    make install

requirements:
  build:
    - cmake >= 3.5
    - make
    - ${{ compiler("cxx") }}
    - pkg-config
    - git
    - if: not win
      then:
        - libtool
    - openjpeg  # For JPEG2000 support
    - charls    # For JPEG-LS support

tests:
  - script:
      - dcm2niix -h
      - dcm2niibatch ./batch_config.yml
      - dcm2niix | grep -i "JP-LS"  # Verify JPEG-LS support
    files:
      source:
        - batch_config.yml

about:
  homepage: https://github.com/rordenlab/dcm2niix
  license: BSD-2-Clause
  summary: Convert DICOM to NIfTI format with JPEG-LS support
